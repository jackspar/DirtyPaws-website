<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirty Paws Animal Rescue — Events</title>
  <meta name="description" content="Dirty Paws Animal Rescue adoption events in Contra Costa County. Upcoming events and past event archive.">
  <meta property="og:title" content="Events — Dirty Paws Animal Rescue">
  <meta property="og:image" content="../assets/logos/logo-main.png">
  <meta property="og:type" content="article">
  <link rel="icon" type="image/png" href="../assets/logos/logo-main.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <div class="page-hero">
    <h1>Events</h1>
    <p>Adoption events at PetSmart Walnut Creek and other local venues</p>
  </div>

  <!-- No upcoming event state -->
  <section class="events-upcoming">
    <h2>Upcoming Events</h2>
    <div class="events-none">
      <p>No upcoming events scheduled right now.</p>
      <p style="margin-top: 8px;">Follow us on <a href="https://www.instagram.com/dirtypawsanimalrescue/" target="_blank" rel="noopener">Instagram</a> and <a href="https://www.facebook.com/DirtyPawsAnimalRescue/" target="_blank" rel="noopener">Facebook</a> for announcements.</p>
    </div>
  </section>

  <!-- Past Events Archive -->
  <section class="events-archive">
    <h2>Past Events</h2>
    <div class="events-grid">

      <!-- 2026 -->
      <div class="event-thumb" data-full="../assets/events/2026/poster-2026-01-10-petsmart.jpg">
        <img src="../assets/events/2026/poster-2026-01-10-petsmart.jpg" alt="Event poster">
        <div class="event-thumb-label">Jan 10, 2026 · PetSmart</div>
      </div>

      <!-- 2025 -->
      <div class="event-thumb" data-full="../assets/events/2025/poster-2025-12-20.jpg">
        <img src="../assets/events/2025/poster-2025-12-20.jpg" alt="Event poster">
        <div class="event-thumb-label">Dec 20, 2025</div>
      </div>

      <div class="event-thumb" data-full="../assets/events/2025/poster-2025-10-25.jpg">
        <img src="../assets/events/2025/poster-2025-10-25.jpg" alt="Event poster">
        <div class="event-thumb-label">Oct 25, 2025</div>
      </div>

      <div class="event-thumb" data-full="../assets/events/2025/poster-2025-10-18.jpg">
        <img src="../assets/events/2025/poster-2025-10-18.jpg" alt="Event poster">
        <div class="event-thumb-label">Oct 18, 2025</div>
      </div>

      <div class="event-thumb" data-full="../assets/events/2025/poster-2025-10-04.jpg">
        <img src="../assets/events/2025/poster-2025-10-04.jpg" alt="Event poster">
        <div class="event-thumb-label">Oct 4, 2025</div>
      </div>

      <!-- 2024 -->
      <div class="event-thumb" data-full="../assets/events/2024/poster-2024-12-22.jpg">
        <img src="../assets/events/2024/poster-2024-12-22.jpg" alt="Event poster">
        <div class="event-thumb-label">Dec 22, 2024</div>
      </div>

    </div>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <img src="" alt="Event poster full size">
  </div>

  <footer id="site-footer"></footer>

  <script src="../js/main.js"></script>
</body>
</html>
